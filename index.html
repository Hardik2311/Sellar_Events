<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Razorpay checkout window (src/lib/razorpay.ts) -->
  <link rel="preconnect" href="https://checkout.razorpay.com" />
  <!--
    A stale cached index.html (e.g. on Safari, which can be more aggressive
    about reusing a cached page than Chrome) can point at a JS chunk hash
    that no longer exists after a deploy. If that's the *entry* script
    itself, it fails before React (and our in-app ErrorBoundary) ever runs,
    so nothing else can catch it — this would otherwise just be a blank
    white screen forever. Catch that specific case here and do a single
    guarded reload, which (now that index.html is served no-cache) fetches
    the current, correct build on retry.

    Only our own build files (/assets/...) count. Third-party scripts —
    Analytics' gtag.js, scripts that in-app browsers inject — get blocked by
    content blockers and Safari Private Browsing, and reacting to those
    reloaded the page in a tight loop. The guard is a timestamp rather than
    a flag cleared on every boot (which is what let that loop happen): at
    most one automatic reload per 30 seconds, so a failure that survives a
    reload is left alone.

    Deliberately first thing in <head>, before Vite's injected entry
    <script type="module"> tag (which it hoists to the end of <head> at
    build time) — the error listener must be registered before that script
    tag is even parsed, since a module script begins fetching immediately
    and browsers dispatch its error event as soon as the fetch fails.
  -->
  <script>
    (function () {
      var GUARD_KEY = 'app:reloadedForEntryLoadError';
      var MIN_RELOAD_INTERVAL_MS = 30000;
      var ASSET_PREFIX = location.origin + '/assets/';
      window.addEventListener('error', function (e) {
        var target = e.target;
        if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK')) return;
        var url = target.src || target.href || '';
        if (url.indexOf(ASSET_PREFIX) !== 0) return;
        try {
          var lastReload = Number(sessionStorage.getItem(GUARD_KEY)) || 0;
          if (Date.now() - lastReload < MIN_RELOAD_INTERVAL_MS) return;
          sessionStorage.setItem(GUARD_KEY, String(Date.now()));
        } catch (err) {
          return; // can't record the guard, so a reload could loop — skip it
        }
        location.reload();
      }, true);
    })();
  </script>
  <link rel="icon" type="image/png" href="/Outsold.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outsold</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
