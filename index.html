<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!--
    A blanket "reload on any script/link error" guard used to live here.
    Removed: it fired on ANY resource error (not narrowly matched to the
    stale-chunk-after-deploy case it was meant for), never logged anything,
    and — because main.tsx used to clear its sessionStorage flag on every
    successful mount — could re-arm itself and turn an ordinary transient
    network hiccup on mobile into a silent, repeating reload loop with no
    console trace and no crash log to point at. ErrorBoundary.tsx already
    covers the real stale-chunk scenario: it's pattern-matched to actual
    chunk-load failures, logs before acting, and reloads at most once per
    tab session (see RELOAD_GUARD_KEY there) — no second, cruder mechanism
    needed on top of it.
  -->
  <link rel="icon" type="image/png" href="/Outsold.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Outsold</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
